<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ — Audio Courseware</title>
<style>
  :root {
    --primary: #1E4FA8; --deep: #0E3F8C; --bg: #F4F7FB; --ink: #1A2233;
    --muted: #8B97A8; --panel: #FFFFFF; --line: #D6DCE5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: var(--ink); overflow: hidden; }

  #stage { position: absolute; inset: 0 0 0 0; display: flex; align-items: center; justify-content: center; }
  #slideImg { max-width: 100%; max-height: calc(100% - var(--bottomH)); object-fit: contain; box-shadow: 0 4px 24px rgba(14,63,140,.18); background: #fff; }
  :root { --bottomH: 190px; }
  body.narration-off { --bottomH: 84px; }

  #bottom { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottomH); background: var(--panel); border-top: 2px solid var(--line); display: flex; flex-direction: column; transition: height .25s; }
  #progressRow { display: flex; align-items: center; gap: 12px; padding: 10px 18px 0 18px; }
  #pageSlider { flex: 1; accent-color: var(--primary); cursor: pointer; }
  #pageLabel { font-size: 14px; font-weight: bold; color: var(--primary); min-width: 84px; text-align: center; }

  #narrationBox { flex: 1; overflow-y: auto; padding: 10px 22px; font-size: 15.5px; line-height: 1.55; color: #33415C; }
  .zh { margin-top: 8px; padding-top: 8px; border-top: 1px solid #D6DCE5; font-size: 14.5px; line-height: 1.5; color: #555; }
  body.narration-off #narrationBox { display: none; }

  #controlsRow { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 12px 12px 12px; }
  button.ctl { border: 1px solid var(--line); background: #F0F5FC; color: var(--deep); border-radius: 10px; padding: 8px 14px; font-size: 15px; cursor: pointer; transition: background .15s; }
  button.ctl:hover { background: #E2ECF8; }
  button.ctl.primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: bold; padding: 8px 22px; }
  button.ctl.primary:hover { background: var(--deep); }
  button.ctl.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  #header { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 8px 18px; pointer-events: none; }
  #header .tag { background: rgba(30,79,168,.85); color: #fff; font-size: 12.5px; padding: 4px 12px; border-radius: 12px; letter-spacing: .5px; }

  #startOverlay { position: fixed; inset: 0; background: linear-gradient(160deg, #0E3F8C 0%, #1E4FA8 60%, #2A5CB8 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 50; cursor: pointer; }
  #startOverlay h1 { color: #fff; font-size: 34px; text-align: center; max-width: 760px; line-height: 1.35; }
  #startOverlay h2 { color: #BFD4F2; font-size: 17px; font-weight: normal; }
  #bigPlay { width: 110px; height: 110px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 44px; color: var(--primary); box-shadow: 0 8px 40px rgba(0,0,0,.35); transition: transform .15s; }
  #startOverlay:hover #bigPlay { transform: scale(1.08); }
  #startHint { color: #BFD4F2; font-size: 14px; }

  #gridOverlay { position: fixed; inset: 0; background: rgba(20,32,46,.94); z-index: 40; display: none; overflow-y: auto; padding: 24px; }
  #gridOverlay.open { display: block; }
  #gridInner { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; max-width: 1400px; margin: 0 auto; }
  .thumb { cursor: pointer; border: 2px solid transparent; border-radius: 8px; overflow: hidden; position: relative; }
  .thumb.current { border-color: #FFB74D; }
  .thumb img { width: 100%; display: block; }
  .thumb .n { position: absolute; top: 4px; left: 6px; background: rgba(14,63,140,.85); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 8px; }
  #gridClose { position: sticky; top: 0; float: right; z-index: 2; }

  #endCard { position: fixed; inset: 0; background: rgba(14,63,140,.96); z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fff; }
  #endCard.open { display: flex; }
  #endCard h1 { font-size: 40px; } #endCard p { color: #BFD4F2; font-size: 17px; }
</style>
</head>
<body class="">

<div id="stage"><img id="slideImg" src="img/001.png" alt="slide"></div>

<div id="header">
  <span class="tag">__HEADER_TAG__</span>
  <span class="tag" id="autoTag">AUTO-PLAY: ON</span>
</div>

<div id="bottom">
  <div id="progressRow">
    <span id="pageLabel">1 / 120</span>
    <input type="range" id="pageSlider" min="1" max="120" value="1" step="1">
  </div>
  <div id="narrationBox"></div>
  <div id="controlsRow">
    <button class="ctl" id="btnPrev"  title="Previous (←)">⏮ Prev</button>
    <button class="ctl primary" id="btnPlay" title="Play / Pause (Space)">⏸ Pause</button>
    <button class="ctl" id="btnNext"  title="Next (→)">Next ⏭</button>
    <button class="ctl active" id="btnAuto"  title="Auto-advance on audio end">Auto</button>
    <button class="ctl active" id="btnNarr" title="Show narration text (N)">📜 Text</button>
    <button class="ctl" id="btnGrid"  title="Slide overview (G)">▦ Pages</button>
    <button class="ctl" id="btnFull"  title="Fullscreen (F)">⛶</button>
  </div>
</div>

<div id="startOverlay">
  <div id="bigPlay">▶</div>
  <h1>__OVERLAY_TITLE__</h1>
  <h2>__OVERLAY_SUBTITLE__</h2>
  <div id="startHint">Click anywhere to start · Space pause · ←/→ navigate · G page overview</div>
</div>

<div id="gridOverlay">
  <button class="ctl" id="gridClose">✕ Close</button>
  <div id="gridInner"></div>
</div>

<div id="endCard">
  <h1>🎉 Course complete</h1>
  <p>You have listened to all 120 slides. Review any section with ← → or the pages grid.</p>
  <button class="ctl primary" id="btnRestart">↻ Restart from slide 1</button>
</div>

<script>
const N = 120;
const NARR_EN = __NARRATIONS_EN__;
const NARR_ZH = __NARRATIONS_ZH__;
let cur = 1, playing = false, autoAdv = true;
const audio = new Audio();
const nextAudio = new Audio();
const img = document.getElementById('slideImg');
const pageLabel = document.getElementById('pageLabel');
const slider = document.getElementById('pageSlider');
const narrBox = document.getElementById('narrationBox');
const btnPlay = document.getElementById('btnPlay');
const endCard = document.getElementById('endCard');

const pad = n => String(n).padStart(3, '0');
const srcAudio = n => `audio/${pad(n)}.mp3`;
const srcImg   = n => `img/${pad(n)}.png`;
const srcImgAlt = n => `img/${pad(n)}.svg`;

function show(n, autoplay) {
  cur = Math.min(N, Math.max(1, n));
  audio.pause();
  audio.src = srcAudio(cur);
  img.onerror = () => { img.onerror = null; img.src = srcImgAlt(cur); };
  img.src = srcImg(cur);
  const zh = NARR_ZH[cur - 1];
  narrBox.innerHTML = NARR_EN[cur - 1] + (zh ? '<div class="zh">' + zh + '</div>' : '');
  pageLabel.textContent = `${cur} / ${N}`;
  slider.value = cur;
  document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('current', +t.dataset.n === cur));
  const na = nextAudio;
  if (cur < N) { na.src = srcAudio(cur + 1); na.preload = 'auto'; }
  if (autoplay) play(); else setPlaying(false);
  if (cur === N) audio.onended = () => { setPlaying(false); endCard.classList.add('open'); };
  else audio.onended = () => { if (autoAdv) show(cur + 1, true); else setPlaying(false); };
}

function play() { audio.play().then(() => setPlaying(true)).catch(() => { setPlaying(false); }); }
function pause() { audio.pause(); setPlaying(false); }
function setPlaying(v) {
  playing = v;
  btnPlay.textContent = v ? '⏸ Pause' : '▶ Play';
}
function next() { show(cur + 1, playing || autoAdv); }
function prev() { show(cur - 1, playing); }

btnPlay.onclick = () => playing ? pause() : play();
document.getElementById('btnNext').onclick = next;
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnAuto').onclick = e => {
  autoAdv = !autoAdv;
  e.target.classList.toggle('active', autoAdv);
  document.getElementById('autoTag').textContent = 'AUTO-PLAY: ' + (autoAdv ? 'ON' : 'OFF');
};
document.getElementById('btnNarr').onclick = e => {
  document.body.classList.toggle('narration-off');
  e.target.classList.toggle('active', !document.body.classList.contains('narration-off'));
};
document.getElementById('btnFull').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};
slider.oninput = () => show(+slider.value, playing);

/* grid overview */
const gridInner = document.getElementById('gridInner');
for (let i = 1; i <= N; i++) {
  const d = document.createElement('div');
  d.className = 'thumb'; d.dataset.n = i;
  const im = document.createElement('img');
  im.loading = 'lazy'; im.src = srcImg(i);
  im.onerror = () => { im.onerror = null; im.src = srcImgAlt(i); };
  const b = document.createElement('span'); b.className = 'n'; b.textContent = i;
  d.append(im, b);
  d.onclick = () => { closeGrid(); show(i, playing || autoAdv); };
  gridInner.appendChild(d);
}
const gridOverlay = document.getElementById('gridOverlay');
function closeGrid() { gridOverlay.classList.remove('open'); }
document.getElementById('btnGrid').onclick = () => gridOverlay.classList.add('open');
document.getElementById('gridClose').onclick = closeGrid;
document.getElementById('btnRestart').onclick = () => { endCard.classList.remove('open'); show(1, true); };

/* keyboard */
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key.toLowerCase() === 'f') document.getElementById('btnFull').click();
  else if (e.key.toLowerCase() === 'g') gridOverlay.classList.toggle('open');
  else if (e.key.toLowerCase() === 'n') document.getElementById('btnNarr').click();
  else if (e.key === 'Escape') closeGrid();
});

/* start overlay */
document.getElementById('startOverlay').onclick = () => {
  document.getElementById('startOverlay').style.display = 'none';
  show(1, true);
};

/* preload first slide text */
narrBox.innerHTML = NARR_EN[0] + (NARR_ZH[0] ? '<div class="zh">' + NARR_ZH[0] + '</div>' : '');
</script>
</body>
</html>
